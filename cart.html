<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | PCBUILDER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="cart-page">
<header>
  <div class="navwrap">
    <a href="index.html" class="brand">PC<span>BUILDER</span></a>
    <nav>
      <a href="index.html" class="btn btn-secondary btn-sm">Home</a>
      <a href="product.html" class="btn btn-secondary btn-sm">Products</a>
    </nav>
  </div>
</header>

<main class="container py-4">
  <h1 class="mb-4">Your Cart</h1>
  <div id="cart-root"></div>
</main>

<footer>
  <p>PCBUILDER</p>
  <p>Email: support@pcbuilder.com | Phone: +1 555-1234</p>
</footer>

<!-- Payment modal -->
<div class="modal fade" id="payment-modal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="payment-form">
        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalLabel">Proceed to Pay</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Your order total is <strong id="payment-total">Rs 0</strong>.</p>
          <div class="mb-3">
            <label class="form-label">Payment method</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment-method" id="payment-credit" value="Credit Card">
              <label class="form-check-label" for="payment-credit">Credit Card</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment-method" id="payment-debit" value="Debit Card">
              <label class="form-check-label" for="payment-debit">Debit Card</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment-method" id="payment-netbanking" value="Net Banking">
              <label class="form-check-label" for="payment-netbanking">Net Banking</label>
            </div>
          </div>
          <div id="payment-details" class="mb-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Pay Now</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="cart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
