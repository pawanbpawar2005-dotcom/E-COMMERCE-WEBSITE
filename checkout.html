<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | PCBUILDER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="checkout-page">
<header>
  <div class="navwrap">
    <a href="index.html" class="brand">PC<span>BUILDER</span></a>
    <nav>
      <a href="index.html" class="btn btn-secondary btn-sm">Home</a>
      <a href="product.html" class="btn btn-secondary btn-sm">Products</a>
      <a href="cart.html" class="btn btn-secondary btn-sm">Cart</a>
    </nav>
  </div>
</header>

<main class="container py-4">
  <h1 class="mb-4">Checkout</h1>

  <div class="row">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-header">
          <h5>Shipping Details</h5>
        </div>
        <div class="card-body">
          <form id="shipping-form">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="first-name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first-name" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="last-name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last-name" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="street-address" class="form-label">Street Address</label>
              <input type="text" class="form-control" id="street-address" required>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" class="form-control" id="city" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="state" class="form-label">State/Province</label>
                <input type="text" class="form-control" id="state" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="zip-code" class="form-label">ZIP Code</label>
                <input type="text" class="form-control" id="zip-code" required>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card mb-4">
        <div class="card-header">
          <h5>Order Summary</h5>
        </div>
        <div class="card-body">
          <div id="order-summary">
            <!-- Order items will be populated by JavaScript -->
          </div>
          <hr>
          <div class="d-flex justify-content-between">
            <strong>Total:</strong>
            <strong id="order-total">Rs 0</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5>Payment</h5>
          <div id="checkout-message" class="mb-3"></div>
          <div id="paypal-button-container"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>PCBUILDER</p>
  <p>Email: support@pcbuilder.com | Phone: +1 555-1234</p>
</footer>

<script src="cart.js"></script>
<script src="api.js"></script>
<script src="checkout.js"></script>
</body>
</html>
